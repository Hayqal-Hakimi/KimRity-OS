# ~/.config/hypr/hypridle.conf — lock after 5 min, screen off after 15 min
general {
    # `lock` (not `hyprlock`): refuses to lock while the account has no password,
    # because PAM cannot unlock a locked account — that would be a one-way door
    # on a fresh install, where install.sh has not set a password yet.
    lock_cmd         = pidof hyprlock || ~/.local/bin/lock
    before_sleep_cmd = ~/.local/bin/lock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
