# ~/.config/hypr/hyprland.conf — minimal (arch-uji)
# Setiap baris di sini ditulis sendiri; tiada tema/preset dibawa masuk.

# VM QEMU: mod 16:9 supaya penuh dalam tetingkap. Output lain guna preferred.
monitor = Virtual-1, 1360x768, 0x0, 1
monitor = , preferred, auto, 1

$mod      = SUPER
$terminal = kitty
$menu     = ~/.local/bin/menu-toggle
$apps     = wofi --show drun --conf ~/.config/wofi/menu.conf --style ~/.config/wofi/style.css

exec-once = waybar
exec-once = qs -c kimrity -d
exec-once = mako
exec-once = ~/.local/bin/wallpaper
exec-once = hypridle
exec-once = hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

input {
    kb_layout     = us
    follow_mouse  = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in             = 5
    gaps_out            = 10
    border_size         = 2
    col.active_border   = rgba(89b4faee) rgba(a6e3a1ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout              = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

# --- kekunci ---
bind = $mod, RETURN, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod SHIFT, D, exec, $apps
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod SHIFT, V, togglefloating,

# ---------------------------------------------------------------- aplikasi
bind = $mod, E, exec, kitty yazi
bind = $mod, B, exec, firefox
bind = $mod, N, exec, kitty -e nvim

# -------------------------------------------------------- preset workspace
bind = $mod, F1, exec, ~/.local/bin/workspace-launch F1
bind = $mod, F2, exec, ~/.local/bin/workspace-launch F2
bind = $mod, F3, exec, ~/.local/bin/workspace-launch F3

# ------------------------------------------------------------------ tetingkap
bind = $mod, TAB,       cyclenext
bind = $mod SHIFT, TAB, swapnext
bind = $mod, P,         pseudo
bind = $mod, J,         layoutmsg, togglesplit

# ------------------------------------------------------------ saiz tetingkap
bind = $mod CTRL, left,  resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up,    resizeactive, 0 -40
bind = $mod CTRL, down,  resizeactive, 0 40

# ----------------------------------------------------- scratchpad + sistem
bind = $mod, GRAVE,       togglespecialworkspace, magic
bind = $mod SHIFT, GRAVE, movetoworkspace, special:magic
bind = $mod, L,           exec, hyprlock
bind = $mod SHIFT, Q,     exec, ~/.local/bin/powermenu
bind = , PRINT,           exec, ~/.local/bin/screenshot full
bind = $mod SHIFT, S,     exec, ~/.local/bin/screenshot region
bind = $mod, V,           exec, ~/.local/bin/cliphist-menu

# ---------------------------------------------------------- kunci media
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bind = $mod, F, fullscreen,

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
