#!/usr/sbin/nft -f
# KimRity baseline firewall (Oct 27)
# Policy: inbound = drop; outbound = allow (strict egress comes later with KimAI).
# The SSH source is set once, here. 10.0.2.2 is the QEMU user-mode NAT gateway —
# on real hardware replace it with your LAN (e.g. 192.168.1.0/24) or you lock
# yourself out. This file is NOT installed by install.sh for that reason.

define SSH_SRC = 10.0.2.2
define SSH_PORT = 22

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH from the host (port-forward 2222 -> 22)
        ip saddr $SSH_SRC tcp dport $SSH_PORT accept

        # DHCP + DNS from the QEMU NAT
        udp dport 67-68 accept
        udp dport 53 accept

        limit rate 5/minute log prefix "nft-drop-in: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
