title: SSH Brute Force - Multiple Failed Logins from a Single Source
id: 9e18bab4-fa4b-4f42-8f8a-b2a2d9d90841
status: experimental
description: |
  Detects repeated failed SSH login attempts (invalid user or wrong
  credentials) from a single source address within a short window. This
  pattern indicates brute force or password spraying against SSH.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Hayqal (arch-uji lab)
date: 2026-10-17
tags:
  - attack.credential_access
  - attack.t1110.001
logsource:
  product: linux
  service: sshd
detection:
  selection:
    keywords:
      - 'Invalid user'
      - 'Failed password'
      - 'Failed publickey'
      - 'Connection closed by authenticating user'
  timeframe: 5m
  condition: selection | count() by src_ip > 5
fields:
  - src_ip
  - user
falsepositives:
  - Vulnerability scanners or in-scope pentests
  - Backup/monitoring scripts with stale credentials
  - A user repeatedly mistyping their password (rarely more than 5 times in 5 minutes)
level: medium
