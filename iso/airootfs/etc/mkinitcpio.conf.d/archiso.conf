# archiso mkinitcpio drop-in — taken verbatim from the official archiso releng
# profile (/usr/share/archiso/configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf).
#
# Why this file must exist: without it the initramfs is built from the plain
# Arch /etc/mkinitcpio.conf, which has no archiso hook and uses autodetect.
# The resulting initramfs cannot locate or mount the ISO medium, so the image
# drops to an emergency shell ("Timed out waiting for device /dev/gpt-auto-root").
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
