#!/usr/sbin/nft -f
# KimRity baseline firewall (27 Okt)
# Dasar: masuk = tolak; keluar = benarkan (egress ketat menyusul bersama KimAI).
# Sumber SSH kelihatan sebagai 10.0.2.2 kerana QEMU user-net (NAT).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH dari hos (port-forward 2222 -> 22)
        ip saddr 10.0.2.2 tcp dport 22 accept

        # DHCP + DNS dari NAT QEMU
        udp dport 67-68 accept
        udp dport 53 accept

        limit rate 5/minute log prefix "nft-drop-in: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
