# ~/.config/hypr/hyprlock.conf — minimal lock screen
background {
    color = rgb(30, 30, 46)
}

label {
    text        = $TIME
    color       = rgb(205, 214, 244)
    font_size   = 64
    font_family = monospace
    position    = 0, 120
    halign      = center
    valign      = center
}

label {
    text        = KimRity
    color       = rgb(137, 180, 250)
    font_size   = 18
    position    = 0, 20
    halign      = center
    valign      = center
}

input-field {
    size            = 260, 44
    outline_thickness = 2
    dots_size       = 0.25
    dots_spacing     = 0.4
    dots_center     = true
    outer_color     = rgb(137, 180, 250)
    inner_color     = rgb(49, 50, 68)
    font_color      = rgb(205, 214, 244)
    fade_on_empty   = false
    placeholder_text = <i>password</i>
    hide_input      = true
    position        = 0, -60
    halign          = center
    valign          = center
}
